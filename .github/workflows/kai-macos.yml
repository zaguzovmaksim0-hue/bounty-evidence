name: Kai commissioned macOS compatibility test
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
  attestations: write
env:
  KAI_WORKER: '0x75ea41b47ca3c3c3f1a87c7ece30cfea708bda0d'
jobs:
  profiler:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Disclosed commissioned software test for Kai
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 11359 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/kai_csv_profiler-0.2.4rc1-py3-none-any.whl" -o kai_csv_profiler-0.2.4rc1-py3-none-any.whl
          cat > probe.py <<'KAI_PY'
          import hashlib,json,os,pathlib,platform,subprocess,sys,tempfile
          from datetime import datetime,timezone
          W='kai_csv_profiler-0.2.4rc1-py3-none-any.whl'
          H='9abe5133c7f2f114e2994c5061b654c35705c8733fa9f555d18cffa59fef4cc0'
          N='9d959239894ed933eebcd1010d25d8ddc993e1ba77a8bbd0dddc1f16888a21e0'
          w=pathlib.Path(W).resolve(strict=True)
          assert __debug__ and sys.version_info>=(3,11)
          assert w.stat().st_size==11359 and hashlib.sha256(w.read_bytes()).hexdigest()==H
          p={'nonce':'kai-fixed-rc-macos-8650-v1','time':datetime.now(timezone.utc).isoformat(),'wheel_sha256':H,'script_sha256':hashlib.sha256(pathlib.Path(__file__).read_bytes()).hexdigest(),'system':platform.system(),'platform':platform.platform(),'python':sys.version,'machine':platform.machine(),'proc_fd':pathlib.Path('/proc/self/fd').exists(),'github':{k:os.environ.get(k) for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_ENVIRONMENT','KAI_WORKER']}}
          def run(a):
           r=subprocess.run(a,stdin=subprocess.DEVNULL,capture_output=True,text=True,timeout=60)
           assert len(r.stdout.encode())+len(r.stderr.encode())<=65536
           return {'exit':r.returncode,'out':r.stdout,'err':r.stderr}
          if p['system']=='Darwin':p['sw_vers']=run(['/usr/bin/sw_vers'])
          with tempfile.TemporaryDirectory(prefix='kai-macos-') as t:
           d=pathlib.Path(t).resolve();v=d/'v';py=str(v/'bin/python')
           assert run([sys.executable,'-m','venv',str(v)])['exit']==0
           p['install']=run([py,'-I','-m','pip','--disable-pip-version-check','install','--no-index','--no-deps',str(w)])
           assert p['install']['exit']==0
           r=run([py,'-I','-c','import hashlib,pathlib,kai_csv_profiler.data_profile as m;print(hashlib.sha256(pathlib.Path(m.__file__).read_bytes()).hexdigest())'])
           assert r['exit']==0 and r['out'].strip()==N
           p['native_sha256']=N
           f=d/'résumé input.csv';f.write_bytes(b'item,quantity,note\napple,2,fresh\npear,3,\nplum,5,ripe\n')
           p['fixture_sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
           link=d/'linked.csv';link.symlink_to(f)
           p['tests']={name:run([str(v/'bin/kai-csv-profile'),'--input-file',str(path)]) for name,path in [('regular',f),('missing',d/'absent.csv'),('symlink',link)]}
           p['observation_complete']=True
          print('KAI_OBSERVATION_BEGIN')
          print(json.dumps(p,sort_keys=True,ensure_ascii=False))
          print('KAI_OBSERVATION_END')
          pathlib.Path('observation.json').write_bytes((json.dumps(p,sort_keys=True,ensure_ascii=False)+'\n').encode('utf-8'))
          KAI_PY
          python3 probe.py
      - name: Attest the exact observation file
        id: attest
        uses: actions/attest@60c80190bb1a4fb35e5724ede753db5656412b68
        with:
          subject-path: observation.json
          create-storage-record: false
      - name: Export signed result capsule for owner submission
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 - <<'KAI_CAPSULE'
          import base64,json,os,pathlib
          report=pathlib.Path('observation.json').read_bytes()
          bundle=pathlib.Path(os.environ['ATTESTATION_BUNDLE']).read_bytes()
          assert 0<len(report)<=32768 and 0<len(bundle)<=49152
          capsule={'schema':'kai-signed-observation-v1','report_base64':base64.b64encode(report).decode('ascii'),'bundle':json.loads(bundle)}
          encoded=(json.dumps(capsule,sort_keys=True,separators=(',',':'))+'\n').encode('utf-8')
          assert len(encoded)<=98304
          pathlib.Path('capsule.json').write_bytes(encoded)
          print('KAI_SIGNED_CAPSULE_BEGIN')
          print(encoded.decode('utf-8'),end='')
          print('KAI_SIGNED_CAPSULE_END')
          KAI_CAPSULE

